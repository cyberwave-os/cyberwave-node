<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cyberwave route preview</title></head><body><main>
<h1>Route timeline · kinematic preview</h1><p class="muted">A clock-controlled kinematic preview, independent of rendering and command dispatch. No collision, dynamics or reachability claim.</p>
<p id="context"></p><div class="columns"><section class="card"><svg id="plot" viewBox="0 0 600 390" role="img" aria-label="Observed pose and preview route"></svg><p><span class="observed">● Observed REST pose</span> · <span class="preview">● Simulated preview</span></p><p id="pose"></p></section>
<section class="card"><label for="target">Target twin</label><select id="target"></select><h2>Route</h2><ol id="route"></ol><label for="speed">Preview speed (m/s)</label><input id="speed" type="number" min="0.1" max="100" value="20" step="0.1"><p><button id="play">Play preview</button><button id="pause" disabled>Pause</button><button id="reset">Reset</button></p><label for="seek">Preview time</label><input id="seek" type="range" min="0" max="1" step="0.01" value="0"><p id="clock"></p><p id="status" role="status"></p></section></div>
</main><script type="module" src="/src/mission-simulation.ts"></script><script type="module" src="/src/example-shell.ts"></script></body></html>
