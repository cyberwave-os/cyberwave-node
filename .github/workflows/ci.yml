name: JavaScript SDK
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: git diff --exit-code -- src/generated schema
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/training/requirements-test.txt
      - run: python -m unittest discover -s examples/training -v
