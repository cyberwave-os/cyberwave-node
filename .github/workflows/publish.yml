name: Publish JavaScript and Frontend SDK
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: sdk-npm-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Match the release tag to all three packages
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: pnpm ci:check
        env:
          CYBERWAVE_PACK_DEST: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/training/requirements-test.txt
      - run: python -m unittest discover -s examples/training -v
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: release/*.tgz
          if-no-files-found: error
  publish:
    needs: validate
    if: github.repository == 'cyberwave-os/cyberwave-node'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm >=11.5.1 is required for trusted publishing (OIDC).
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: packages
      - name: Publish the exact tested archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-packages.mjs packages "$RELEASE_TAG"
